name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "arena-app/**"
      - "android-build/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "arena-app/**"
      - "android-build/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-build/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Generate Android project (Capacitor) + apply overlay
        working-directory: android-build
        run: ./setup-android.sh

      - name: Build debug APK
        working-directory: android-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp android-build/android/app/build/outputs/apk/debug/app-debug.apk "out/arena-lite-debug-${SHA}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: arena-lite-debug-apk
          path: out/*.apk
          retention-days: 30

      # On pushes to main, also publish the APK as a downloadable GitHub Release
      - name: Publish release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Arena Lite APK build ${{ github.run_number }}
          body: |
            Debug APK built from `${{ github.sha }}`.
            Install on Android: download the `.apk`, open it, allow "install from this source".
          files: out/*.apk
